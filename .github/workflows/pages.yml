name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog engine
        uses: actions/checkout@v4
        with:
          repository: StCost/blog
          ref: main
          path: engine

      - name: Checkout posts
        uses: actions/checkout@v4
        with:
          repository: DreamingSaints/blog
          ref: main
          path: posts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and build
        working-directory: engine
        env:
          SITE_URL: https://blog.dreamingsaints.com
          BASE_PATH: /
          SITE_TAGLINE: developing video games for fun
          GITHUB_EDIT_REPO: DreamingSaints/blog
          GOOGLE_SITE_VERIFICATION: 7JopGsGbNueXoc9ZJlGRP219qtxwHVTk11TysHWcQgY
        run: |
          set -euo pipefail
          export POSTS_DIR="$GITHUB_WORKSPACE/posts"
          bun install --frozen-lockfile
          bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
